<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="max-w-md w-full bg-white shadow-lg rounded-xl p-8">
    <h2 class="text-3xl font-bold text-green-700 text-center mb-6">Staff Registration</h2>
    
    <!-- 1. Connect the form to our TypeScript 'registerForm' -->
    <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="space-y-4">
      
      <!-- Full Name -->
      <div>
        <label class="block text-gray-700 font-semibold">Full Name</label>
        <input formControlName="name" type="text" placeholder="Dr. John Doe" 
               class="w-full border border-gray-300 rounded-lg px-3 py-2 mt-1 focus:ring-2 focus:ring-green-500 outline-none">
      </div>

      <!-- Email Address -->
      <div>
        <label class="block text-gray-700 font-semibold">Email Address</label>
        <input formControlName="email" type="email" placeholder="staff@clinic.co.za" 
               class="w-full border border-gray-300 rounded-lg px-3 py-2 mt-1 focus:ring-2 focus:ring-green-500 outline-none">
      </div>

      <!-- South African ID Number (NEW) -->
      <div>
        <label class="block text-gray-700 font-semibold">SA ID Number</label>
        <input formControlName="idNumber" type="text" placeholder="9001015001081" 
               class="w-full border border-gray-300 rounded-lg px-3 py-2 mt-1 focus:ring-2 focus:ring-green-500 outline-none">
        <!-- Error Message -->
        <p *ngIf="registerForm.get('idNumber')?.touched && registerForm.get('idNumber')?.errors?.['invalidSAID']" 
           class="text-red-500 text-xs mt-1">
          Please enter a valid 13-digit South African ID.
        </p>
      </div>

      <!-- Mobile Number (NEW) -->
      <div>
        <label class="block text-gray-700 font-semibold">Mobile Number</label>
        <input formControlName="phoneNumber" type="text" placeholder="0821234567" 
               class="w-full border border-gray-300 rounded-lg px-3 py-2 mt-1 focus:ring-2 focus:ring-green-500 outline-none">
        <!-- Error Message -->
        <p *ngIf="registerForm.get('phoneNumber')?.touched && registerForm.get('phoneNumber')?.errors?.['invalidSAPhone']" 
           class="text-red-500 text-xs mt-1">
          Invalid SA format (e.g., 082 123 4567 or +27).
        </p>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-gray-700 font-semibold">Password</label>
        <input formControlName="password" type="password" placeholder="••••••••" 
               class="w-full border border-gray-300 rounded-lg px-3 py-2 mt-1 focus:ring-2 focus:ring-green-500 outline-none">
      </div>

      <button type="submit" 
              [disabled]="registerForm.invalid"
              class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition font-bold disabled:opacity-50">
        Create Staff Account
      </button>
    </form>
    
    <p class="text-center mt-4 text-sm text-gray-600">
      Already have an account? <a routerLink="/login" class="text-green-700 font-bold">Log In</a>
    </p>
  </div>
</div>
