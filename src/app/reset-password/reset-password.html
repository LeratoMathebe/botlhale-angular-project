<div class="flex flex-col items-center justify-center min-h-screen bg-gray-100">
  <div class="p-8 bg-white shadow-md rounded-lg w-96">

    <!-- FORGOT PASSWORD MODE -->
    <div *ngIf="mode === 'forgot'">
      <h2 class="text-2xl font-bold mb-2 text-center text-green-600">Forgot Password</h2>
      <p class="text-sm text-gray-500 text-center mb-6">
        Enter your email and we'll send you a reset link.
      </p>

      <form [formGroup]="forgotForm" (ngSubmit)="sendResetEmail()">
        <input formControlName="email" 
               type="email" 
               placeholder="Email" 
               class="w-full p-2 mb-4 border rounded">

        <div *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched"
             class="text-red-500 text-xs mb-2">
          Please enter a valid email address.
        </div>

        <button type="submit"
                [disabled]="isLoading"
                class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600 transition disabled:opacity-50">
          {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
        </button>
      </form>

      <!-- Success Message -->
      <div *ngIf="successMessage" class="mt-4 text-green-600 text-sm text-center">
        {{ successMessage }}
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="mt-4 text-red-500 text-sm text-center">
        {{ errorMessage }}
      </div>

      <p class="text-sm mt-4 text-center text-gray-600">
        <a routerLink="/login" class="text-green-600 hover:underline">Back to Login</a>
      </p>
    </div>

    <!-- RESET PASSWORD MODE -->
    <div *ngIf="mode === 'reset'">
      <h2 class="text-2xl font-bold mb-2 text-center text-green-600">Reset Password</h2>
      <p class="text-sm text-gray-500 text-center mb-6">
        Enter your new password below.
      </p>

      <form [formGroup]="resetForm" (ngSubmit)="updatePassword()">
        <input formControlName="password"
               type="password"
               placeholder="New Password"
               class="w-full p-2 mb-4 border rounded">

        <div *ngIf="resetForm.get('password')?.invalid && resetForm.get('password')?.touched"
             class="text-red-500 text-xs mb-2">
          Password must be at least 6 characters.
        </div>

        <input formControlName="confirmPassword"
               type="password"
               placeholder="Confirm New Password"
               class="w-full p-2 mb-4 border rounded">

        <div *ngIf="errorMessage" class="text-red-500 text-xs mb-2">
          {{ errorMessage }}
        </div>

        <button type="submit"
                [disabled]="isLoading"
                class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600 transition disabled:opacity-50">
          {{ isLoading ? 'Updating...' : 'Update Password' }}
        </button>
      </form>

      <!-- Success Message -->
      <div *ngIf="successMessage" class="mt-4 text-green-600 text-sm text-center">
        {{ successMessage }}
      </div>
    </div>

  </div>
</div>
