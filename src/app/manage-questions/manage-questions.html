<div class="min-h-screen bg-gray-50 p-8">
  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-3xl font-bold text-green-700">Manage Questionnaire</h2>
      <div class ="flex gap-4">
         <button *ngIf="questions.length > 0" 
                (click)="togglePreview()" 
                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 shadow transition">
          Preview Form
        </button>

      <button (click)="addQuestion()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 shadow transition">
        + Add New Question
      </button>
      </div>
    </div>

    <form [formGroup]="adminForm" (ngSubmit)="saveStructure()" class="space-y-6">
      <div formArrayName="questions">
        <div *ngFor="let q of questions.controls; let i=index" [formGroupName]="i" 
             class="bg-white p-6 rounded-xl shadow-md border-l-4 border-green-500 mb-6 relative">
          
          <div class="grid grid-cols-2 gap-4">
            <div class="col-span-2 sm:col-span-1">
              <label class="text-sm font-semibold text-gray-600">Question Text</label>
              <input formControlName="label" placeholder="e.g. Do you smoke?" 
                     class="w-full border p-2 rounded mt-1">
              
              <!-- Custom Validation Error Messages -->
              <div *ngIf="q.get('label')?.errors?.['invalidSAID']" class="text-red-500 text-xs mt-1 italic">
                 Invalid 13-digit SA ID format.
              </div>
              <div *ngIf="q.get('label')?.errors?.['invalidSAPhone']" class="text-red-500 text-xs mt-1 italic">
                 Invalid SA Mobile format (0XX... or +27...).
              </div>
            </div>

            <div class="col-span-2 sm:col-span-1">
              <label class="text-sm font-semibold text-gray-600">Database Key (lowercase)</label>
              <input formControlName="key" placeholder="e.g. smoke_status" 
                     class="w-full border p-2 rounded mt-1">
            </div>

            <div class="col-span-2 sm:col-span-1">
              <label class="text-sm font-semibold text-gray-600">Input Type</label>
              <select formControlName="type" class="w-full border p-2 rounded mt-1">
                <option value="text">Open Text Field</option>
                <option value="radio">Yes/No Selection </option>
                <option value="dropdown">Dropdown List</option>
                <option value="page-break">Page Break</option>
              </select>
            </div>

            <!-- NEW: South African Validation Dropdown -->
            <div class="col-span-2 sm:col-span-1">
              <label class="text-sm font-semibold text-blue-600">South African Format Validation</label>
              <select formControlName="validation_type" class="w-full border-blue-200 border p-2 rounded mt-1 bg-blue-50 text-blue-800 font-medium focus:ring-2 focus:ring-blue-400">
                <option value="none">No Special Format</option>
                <option value="sa_id">Enforce SA ID (13 Digits)</option>
                <option value="sa_phone">Enforce SA Mobile</option>
              </select>
            </div>

            <div class="flex items-center mt-6">
              <input type="checkbox" formControlName="is_required" class="mr-2 h-4 w-4">
              <label class="text-sm font-semibold text-gray-600">Mark as Required</label>
            </div>

            <div class="col-span-2 sm:col-span-1">
                <label class="text-sm font-semibold text-gray-600">Page / Step Number</label>
                <input type="number" formControlName="page_number" min="1"
                    class="w-full border p-2 rounded mt-1 bg-gray-50" 
                    placeholder="e.g. 1">
            </div>

            <div *ngIf="q.get('type')?.value === 'dropdown' || q.get('type')?.value === 'checkbox'" 
                 class="col-span-2 mt-2 bg-blue-50 p-4 rounded-lg border border-blue-200">
              <label class="text-sm font-semibold text-blue-700">Options (Separate with commas)</label>
              <input formControlName="options" placeholder="e.g. Daily, Weekly, Monthly" 
                     class="w-full border-blue-300 border p-2 rounded mt-1">
            </div>
          </div>

          <button type="button" (click)="removeQuestion(i)" 
                  class="absolute top-4 right-4 text-red-400 hover:text-red-600 transition">
            <span class="text-xs uppercase font-bold">Remove</span>
          </button>
        </div>
      </div>

      <div *ngIf="questions.length > 0" class="pt-6">
        <button type="submit" class="w-full bg-green-700 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-green-800 transition">
          Save All to Supabase
        </button>
      </div>
    </form>
  </div>
</div>

<!-- PREVIEW MODAL -->
<div *ngIf="showPreview" 
     class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-screen overflow-y-auto">
    
    <!-- Modal Header -->
    <div class="flex justify-between items-center p-6 border-b sticky top-0 bg-white">
      <div>
        <h2 class="text-xl font-bold text-green-700">Form Preview</h2>
        <p class="text-xs text-gray-400 mt-1">This is how patients will see your form</p>
      </div>
      <button (click)="togglePreview()" 
              class="text-gray-400 hover:text-gray-600 text-2xl font-bold">
        ✕
      </button>
    </div>

    <!-- Modal Body -->
    <div class="p-6 space-y-4">
      <div *ngFor="let q of questions.controls" class="bg-gray-50 rounded-xl p-5">
        
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          {{ q.get('label')?.value || 'Untitled Question' }}
          <span *ngIf="q.get('is_required')?.value" class="text-red-500 ml-1">*</span>
        </label>

        <!-- Text Field Preview -->
        <input *ngIf="q.get('type')?.value === 'text'"
               type="text" disabled
               [placeholder]="q.get('label')?.value"
               class="w-full border rounded-lg p-3 bg-white text-gray-400 cursor-not-allowed">

        <!-- Radio Preview -->
        <div *ngIf="q.get('type')?.value === 'radio'" class="flex gap-6">
          <label class="flex items-center gap-2 text-gray-600">
            <input type="radio" disabled class="h-4 w-4"> Yes
          </label>
          <label class="flex items-center gap-2 text-gray-600">
            <input type="radio" disabled class="h-4 w-4"> No
          </label>
        </div>

        <!-- Dropdown Preview -->
        <select *ngIf="q.get('type')?.value === 'dropdown'" 
                disabled
                class="w-full border rounded-lg p-3 bg-white text-gray-400 cursor-not-allowed">
          <option>Select an option</option>
          <ng-container *ngIf="q.get('options')?.value">
            <option *ngFor="let opt of q.get('options')?.value?.split(',')">
              {{ opt.trim() }}
            </option>
          </ng-container>
        </select>

        <!-- Checkbox Preview -->
        <div *ngIf="q.get('type')?.value === 'checkbox'" class="space-y-2">
          <ng-container *ngIf="q.get('options')?.value">
            <label *ngFor="let opt of q.get('options')?.value?.split(',')"
                   class="flex items-center gap-2 text-gray-600">
              <input type="checkbox" disabled class="h-4 w-4">
              {{ opt.trim() }}
            </label>
          </ng-container>
        </div>

        <!-- Page Break Preview -->
        <div *ngIf="q.get('type')?.value === 'page-break'" 
             class="border-t-2 border-dashed border-gray-300 pt-2 text-xs text-gray-400 text-center">
          — Page Break —
        </div>

      </div>
    </div>

    <!-- Modal Footer -->
    <div class="p-6 border-t sticky bottom-0 bg-white">
      <button (click)="togglePreview()" 
              class="w-full bg-gray-200 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-300 transition">
        Close Preview
      </button>
    </div>
  </div>
</div>
