<div class="p-8 bg-gray-50 min-h-screen">
  <div class="max-w-7xl mx-auto">

    <!-- Loading State -->
    <div *ngIf="isLoading" class="text-center py-20 text-gray-500">
      Loading results...
    </div>

    <div *ngIf="!isLoading">
      <!-- Header -->
      <div class="flex justify-between items-center mb-6">
        <div>
          <button (click)="goBack()" 
                  class="text-gray-500 hover:text-gray-700 text-sm mb-2 flex items-center gap-1">
            ← Back to Dashboard
          </button>
          <h1 class="text-2xl font-bold text-gray-800">{{ questionnaire?.title }}</h1>
          <p class="text-gray-500 text-sm mt-1">
            {{ submissions.length }} submission{{ submissions.length !== 1 ? 's' : '' }} received
          </p>
        </div>

        <div class="flex gap-3">
          <!-- Export CSV -->
          <button (click)="exportCSV()"
                  class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700">
            Export CSV
          </button>

          <!-- Clear Results -->
          <button (click)="clearResults()"
                  class="bg-red-500 text-white px-4 py-2 rounded-lg font-medium hover:bg-red-600">
            Clear Results
          </button>
        </div>
      </div>

      <!-- No Submissions State -->
      <div *ngIf="submissions.length === 0" 
           class="bg-white rounded-xl shadow p-10 text-center text-gray-500">
        No submissions yet for this questionnaire.
      </div>

      <!-- Results Grid -->
      <div *ngIf="submissions.length > 0" 
           class="bg-white shadow rounded-xl overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-100 text-gray-600 uppercase text-xs">
            <tr>
              <th class="px-4 py-3 whitespace-nowrap">Submitted At</th>
              <th *ngFor="let q of questions" 
                  class="px-4 py-3 whitespace-nowrap">
                {{ q.label }}
              </th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <tr *ngFor="let sub of submissions" class="hover:bg-gray-50">
              <td class="px-4 py-3 text-gray-500 whitespace-nowrap">
                {{ sub.submitted_at | date:'dd MMM yyyy, HH:mm':'UTC+2' }}
              </td>
              <td *ngFor="let q of questions" 
                  class="px-4 py-3 text-gray-700">
                {{ sub.answers[q.id] || '—' }}
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
