<div class="min-h-screen bg-green-50 p-8">

  <h2 class="text-3xl font-bold text-green-700 mb-6 text-center">
    Submitted Responses 📊
  </h2>

  <!-- If no data -->
  <p *ngIf="dataService.responses.length === 0" class="text-center text-gray-500">
    No responses yet.
  </p>

  <!-- Results Grid -->
  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">

    <div 
      *ngFor="let r of dataService.responses"
      class="bg-white p-6 rounded-2xl shadow-md">

      <h3 class="text-xl font-bold text-green-700 mb-2">
        {{ r.name }}
      </h3>

      <p class="text-gray-600">
        Age: <span class="font-semibold">{{ r.age }}</span>
      </p>

      <p class="text-gray-600">
        Favorite Food: <span class="font-semibold">{{ r.food }}</span>
      </p>

    </div>

  </div>

  <!-- Buttons -->
  <div class="flex justify-center gap-4 mt-10">

    <button 
      routerLink="/questionnaire"
      class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700">
      Add Another
    </button>

    <button 
      routerLink="/"
      class="bg-gray-300 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-400">
      Back Home
    </button>

  </div>

</div>
