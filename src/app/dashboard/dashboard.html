<div class="p-8 bg-gray-50 min-h-screen">
  <div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800">Healthcare Questionnaires</h1>
      <button routerLink="/manage-questions" 
              class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-700">
        + Create New
      </button>
    </div>

    <div class="bg-white shadow rounded-xl overflow-hidden">
      <table class="w-full text-left">
        <thead class="bg-gray-100 text-gray-600 uppercase text-sm">
          <tr>
            <th class="px-6 py-4">Questionnaire Name</th>
            <th class="px-6 py-4">Status</th>
            <th class="px-6 py-4">Created Date</th>
            <th class="px-6 py-4">Public Link</th>
            <th class="px-6 py-4 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          <!-- HTML then loops through it and displays each questionnaire in a table row -->
          <tr *ngFor="let q of questionnaires" class="hover:bg-gray-50">
            <td class="px-6 py-4 font-semibold text-gray-700">{{ q.title }}</td>
            <td class="px-6 py-4">
              <span [class]="q.is_published ? 
                'bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs font-medium' : 
                'bg-gray-100 text-gray-600 px-2 py-1 rounded-full text-xs font-medium'">
                {{ q.is_published ? 'Published' : 'Draft' }}
              </span>
            </td>
            <td class="px-6 py-4 text-gray-500">{{ q.created_at | date:'mediumDate' }}</td>
            <td class="px-6 py-4">
              <a *ngIf="q.is_published"
                [href]="'http://localhost:4200/form/' + q.slug"
                target="_blank"
                class="text-xs text-blue-500 hover:underline font-mono break-all">
                localhost:4200/form/{{ q.slug }}
              </a>
              <!-- UUID - a randomly generated unique value used in the URL to identify a questionnaire.
              Yes — in your system, the “slug” is actually a UUID that is generated by Supabase
                     and it is used as a unique identifier in the URL when a questionnaire is published. -->
              
              <span *ngIf="!q.is_published" class="text-xs text-gray-300">
                Not published
              </span>
            </td>
            <td class="px-6 py-4 text-right space-x-3">
              <button (click)="editQuestionnaire(q.id)"
                class="text-blue-600 hover:underline font-medium">Edit</button>

              <!-- Toggle Publish/Unpublish based on current status -->
              <button *ngIf="!q.is_published"
                (click)="publishQuestionnaire(q.id, q.title)"
                class="text-green-600 hover:underline font-medium">Publish</button>

              <button *ngIf="q.is_published"
                (click)="unpublishQuestionnaire(q.id, q.title)"
                class="text-orange-500 hover:underline font-medium">Unpublish</button>

              <button (click)="deleteQuestionnaire(q.id, q.title)"
                class="text-red-600 hover:underline font-medium">Delete</button>

                <button (click)="viewResults(q.id)"
                   class="text-purple-600 hover:underline font-medium">Results</button>
            </td>
          </tr>
        </tbody>
      </table>

      <div *ngIf="questionnaires.length === 0" class="p-10 text-center text-gray-500">
        No questionnaires found. Click "Create New" to get started.
      </div>
    </div>
  </div>
</div>
